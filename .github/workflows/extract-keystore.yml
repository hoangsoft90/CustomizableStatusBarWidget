name: Extract Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > photoclock-release.jks
          echo "=== Keystore info ==="
          keytool -list -v -keystore photoclock-release.jks -storepass 83793900 2>&1 | grep -E "Alias|Owner|Valid|Algorithm|Serial"
          echo ""
          echo "=== File hash ==="
          sha256sum photoclock-release.jks

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoclock-release-keystore
          path: photoclock-release.jks
          retention-days: 5
