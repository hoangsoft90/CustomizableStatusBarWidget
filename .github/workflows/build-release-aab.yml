name: Build Release AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: date_time_widget

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter info
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # ── Release Keystore (from GH Secrets) ────────────────
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/photoclock-release.jks
          ls -la /tmp/photoclock-release.jks

      - name: Build release AAB (signed)
        env:
          KEYSTORE_FILE: /tmp/photoclock-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: date_time_widget/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Print AAB info
        run: |
          echo "✅ Release AAB built successfully!"
          echo "📦 File: build/app/outputs/bundle/release/app-release.aab"
          ls -lh build/app/outputs/bundle/release/
